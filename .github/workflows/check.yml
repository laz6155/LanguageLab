name: Validate static website

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source checks
        run: npm test